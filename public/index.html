<!DOCTYPE html>
<html lang="om">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#176b45"
  >

  <title>OR - Qormaata</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      background: #f3f7f5;
      color: #17221d;
    }

    header {
      background: #176b45;
      color: white;
      padding: 18px 15px;
      text-align: center;
      box-shadow:
        0 2px 10px rgba(0,0,0,.12);
    }

    header h1 {
      margin: 0;
      font-size: 27px;
    }

    header p {
      margin: 6px 0 0;
      opacity: .9;
    }

    main {
      max-width: 850px;
      margin: auto;
      padding: 18px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 18px;
      border-radius: 16px;
      box-shadow:
        0 3px 15px rgba(0,0,0,.07);
    }

    .menu {
      display: grid;
      grid-template-columns:
        repeat(2, 1fr);
      gap: 12px;
    }

    button {
      border: none;
      border-radius: 11px;
      padding: 13px 15px;
      background: #176b45;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: .92;
    }

    button.secondary {
      background: #e8efeb;
      color: #176b45;
    }

    button.danger {
      background: #b42318;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      margin-bottom: 14px;
      border: 1px solid #ccd8d2;
      border-radius: 9px;
      font-size: 15px;
      background: white;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 8px;
    }

    .question {
      border: 1px solid #d9e3de;
      border-radius: 12px;
      padding: 15px;
      margin: 15px 0;
      background: #fbfdfc;
    }

    .option {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 8px 0;
      padding: 9px;
      background: #f0f5f2;
      border-radius: 8px;
    }

    .option input {
      width: auto;
      margin: 0;
    }

    .hidden {
      display: none !important;
    }

    .success {
      background: #e5f7ec;
      color: #12623e;
      padding: 14px;
      border-radius: 10px;
      margin: 12px 0;
    }

    .error {
      background: #fdecec;
      color: #9d1c1c;
      padding: 14px;
      border-radius: 10px;
      margin: 12px 0;
    }

    .info {
      background: #edf5ff;
      color: #174c78;
      padding: 14px;
      border-radius: 10px;
      margin: 12px 0;
    }

    .result-number {
      font-size: 40px;
      font-weight: bold;
      color: #176b45;
      text-align: center;
    }

    .timer {
      position: sticky;
      top: 5px;
      z-index: 10;
      background: #176b45;
      color: white;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-size: 19px;
      margin-bottom: 15px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th,
    td {
      border: 1px solid #d5dfda;
      padding: 9px;
      text-align: left;
    }

    th {
      background: #176b45;
      color: white;
    }

    .small {
      font-size: 13px;
      color: #65756d;
    }

    .link-box {
      word-break: break-all;
      background: #f1f5f3;
      padding: 12px;
      border-radius: 8px;
      margin: 10px 0;
    }

    @media(max-width:600px) {
      .menu {
        grid-template-columns: 1fr;
      }

      main {
        padding: 10px;
      }

      .card {
        padding: 15px;
      }

      table {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🎯 OR</h1>
  <p>Sirna Qormaataa Barattootaa</p>
</header>

<main>

  <!-- HOME -->

  <section id="home" class="card">
    <h2>👋 Baga Nagaan Dhufte</h2>

    <p>
      OR keessatti qormaata uumi,
      qormaata fudhadhu, bu'aa ilaali.
    </p>

    <div class="menu">
      <button onclick="showCreate()">
        ➕ Qormaata Uumi
      </button>

      <button onclick="showJoin()">
        📝 Qormaata Fudhadhu
      </button>

      <button onclick="showTeacherResults()">
        📊 Qormaata Koo
      </button>

      <button
        class="secondary"
        onclick="checkServer()"
      >
        ⚙️ Sirna Ilaali
      </button>
    </div>
  </section>

  <!-- CREATE -->

  <section
    id="create"
    class="card hidden"
  >
    <h2>➕ Qormaata Uumi</h2>

    <label>Maqaa Barsiisaa</label>
    <input
      id="teacherName"
      placeholder="Maqaa kee"
    >

    <label>Mata Duree Qormaataa</label>
    <input
      id="examTitle"
      placeholder="Fakkeenya: Qormaata Herrega"
    >

    <label>Barnoota</label>
    <input
      id="subject"
      placeholder="Herrega"
    >

    <label>Sadarkaa/Kutaa</label>
    <input
      id="grade"
      placeholder="Kutaa 8"
    >

    <label>Yeroo (daqiiqaa)</label>
    <input
      id="duration"
      type="number"
      value="30"
      min="1"
    >

    <h3>Gaaffilee</h3>

    <div id="questions"></div>

    <button
      class="secondary"
      onclick="addQuestion()"
    >
      ➕ Gaaffii Dabal
    </button>

    <br><br>

    <button onclick="createExam()">
      ✅ Qormaata Uumi
    </button>

    <button
      class="secondary"
      onclick="goHome()"
    >
      ← Deebi'i
    </button>

    <div id="createMessage"></div>
  </section>

  <!-- JOIN -->

  <section
    id="join"
    class="card hidden"
  >
    <h2>📝 Qormaata Fudhadhu</h2>

    <label>Maqaa Barataa</label>

    <input
      id="studentName"
      placeholder="Maqaa kee"
    >

    <label>Exam Code</label>

    <input
      id="examCode"
      placeholder="Fakkeenya: A1B2C3D4"
      style="text-transform:uppercase"
    >

    <button onclick="loadExam()">
      🔍 Qormaata Bani
    </button>

    <button
      class="secondary"
      onclick="goHome()"
    >
      ← Deebi'i
    </button>

    <div id="joinMessage"></div>
  </section>

  <!-- EXAM -->

  <section
    id="exam"
    class="card hidden"
  >
    <div id="examInfo"></div>

    <div
      id="timer"
      class="timer"
    >
      ⏱️ 00:00
    </div>

    <div id="examQuestions"></div>

    <button onclick="submitExam()">
      📤 Qormaata Xumuri
    </button>
  </section>

  <!-- RESULT -->

  <section
    id="result"
    class="card hidden"
  >
    <h2>🎉 Bu'aa Qormaataa</h2>

    <div id="resultContent"></div>

    <button onclick="goHome()">
      🏠 Gara Manaa
    </button>
  </section>

  <!-- TEACHER RESULTS -->

  <section
    id="teacherResults"
    class="card hidden"
  >
    <h2>📊 Qormaata Koo</h2>

    <label>Exam Code</label>

    <input
      id="teacherCode"
      placeholder="Exam Code"
      style="text-transform:uppercase"
    >

    <button onclick="loadTeacherResults()">
      🔍 Bu'aa Ilaali
    </button>

    <button
      class="secondary"
      onclick="goHome()"
    >
      ← Deebi'i
    </button>

    <div id="teacherResultContent"></div>
  </section>

  <!-- STATUS -->

  <section
    id="status"
    class="card hidden"
  >
    <h2>⚙️ Haala Sirnaa</h2>

    <div id="statusContent"></div>

    <button onclick="goHome()">
      ← Deebi'i
    </button>
  </section>

</main>

<script>
  let currentExam = null;
  let timerInterval = null;
  let remainingSeconds = 0;

  function hideAll() {
    [
      "home",
      "create",
      "join",
      "exam",
      "result",
      "teacherResults",
      "status"
    ].forEach(id => {
      document
        .getElementById(id)
        .classList.add("hidden");
    });
  }

  function goHome() {
    hideAll();

    document
      .getElementById("home")
      .classList.remove("hidden");

    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
  }

  function showCreate() {
    hideAll();

    document
      .getElementById("create")
      .classList.remove("hidden");

    if (
      document.getElementById("questions")
        .children.length === 0
    ) {
      addQuestion();
    }
  }

  function showJoin() {
    hideAll();

    document
      .getElementById("join")
      .classList.remove("hidden");

    const params =
      new URLSearchParams(
        window.location.search
      );

    const code = params.get("exam");

    if (code) {
      document.getElementById(
        "examCode"
      ).value = code;
    }
  }

  function showTeacherResults() {
    hideAll();

    document
      .getElementById("teacherResults")
      .classList.remove("hidden");
  }

  function addQuestion() {
    const container =
      document.getElementById("questions");

    const number =
      container.children.length + 1;

    const div =
      document.createElement("div");

    div.className = "question";

    div.innerHTML = `
      <h3>Gaaffii ${number}</h3>

      <label>Gosa Gaaffii</label>

      <select
        class="q-type"
        onchange="changeQuestionType(this)"
      >
        <option value="multiple">
          Multiple Choice
        </option>

        <option value="truefalse">
          Dhugaa / Soba
        </option>
      </select>

      <label>Gaaffii</label>

      <textarea
        class="q-text"
        placeholder="Gaaffii barreessi..."
      ></textarea>

      <div class="options">
        <label>Filannoo A</label>
        <input
          class="option-a"
          placeholder="A"
        >

        <label>Filannoo B</label>
        <input
          class="option-b"
          placeholder="B"
        >

        <label>Filannoo C</label>
        <input
          class="option-c"
          placeholder="C"
        >

        <label>Filannoo D</label>
        <input
          class="option-d"
          placeholder="D"
        >
      </div>

      <label>Deebii Sirrii</label>

      <input
        class="q-answer"
        placeholder="Fakkeenya: A"
      >

      <label>Qabxii</label>

      <input
        class="q-points"
        type="number"
        value="1"
        min="1"
      >

      <button
        class="danger"
        onclick="this.parentElement.remove()"
      >
        🗑️ Haqi
      </button>
    `;

    container.appendChild(div);
  }

  function changeQuestionType(select) {
    const question =
      select.parentElement;

    const options =
      question.querySelector(".options");

    const answer =
      question.querySelector(".q-answer");

    if (select.value === "truefalse") {
      options.innerHTML = `
        <div class="info">
          Filannoon:
          <b>Dhugaa</b> fi
          <b>Soba</b>
        </div>
      `;

      answer.placeholder =
        "Dhugaa ykn Soba";
    } else {
      options.innerHTML = `
        <label>Filannoo A</label>
        <input
          class="option-a"
          placeholder="A"
        >

        <label>Filannoo B</label>
        <input
          class="option-b"
          placeholder="B"
        >

        <label>Filannoo C</label>
        <input
          class="option-c"
          placeholder="C"
        >

        <label>Filannoo D</label>
        <input
          class="option-d"
          placeholder="D"
        >
      `;

      answer.placeholder =
        "Fakkeenya: A";
    }
  }

  async function createExam() {
    const message =
      document.getElementById(
        "createMessage"
      );

    message.innerHTML = "";

    const teacherName =
      document.getElementById(
        "teacherName"
      ).value.trim();

    const title =
      document.getElementById(
        "examTitle"
      ).value.trim();

    const subject =
      document.getElementById(
        "subject"
      ).value.trim();

    const grade =
      document.getElementById(
        "grade"
      ).value.trim();

    const duration =
      Number(
        document.getElementById(
          "duration"
        ).value
      );

    if (!teacherName || !title) {
      message.innerHTML =
        `<div class="error">
          Maqaa barsiisaa fi mata duree guuti.
        </div>`;

      return;
    }

    const blocks =
      [
        ...document.querySelectorAll(
          "#questions .question"
        )
      ];

    if (!blocks.length) {
      message.innerHTML =
        `<div class="error">
          Gaaffii tokko yoo xiqqaate galchi.
        </div>`;

      return;
    }

    const questions =
      blocks.map(block => {
        const type =
          block.querySelector(
            ".q-type"
          ).value;

        const question =
          block.querySelector(
            ".q-text"
          ).value.trim();

        const answer =
          block.querySelector(
            ".q-answer"
          ).value.trim();

        const points =
          Number(
            block.querySelector(
              ".q-points"
            ).value
          ) || 1;

        let options = [];

        if (type === "multiple") {
          options = [
            block.querySelector(
              ".option-a"
            )?.value || "",

            block.querySelector(
              ".option-b"
            )?.value || "",

            block.querySelector(
              ".option-c"
            )?.value || "",

            block.querySelector(
              ".option-d"
            )?.value || ""
          ].filter(x => x.trim());
        }

        return {
          type,
          question,
          options,
          answer,
          points
        };
      });

    try {
      const response =
        await fetch("/api/exams", {
          method: "POST",
          headers: {
            "Content-Type":
              "application/json"
          },
          body: JSON.stringify({
            teacherName,
            title,
            subject,
            grade,
            duration,
            questions
          })
        });

      const data =
        await response.json();

      if (!response.ok) {
        throw new Error(
          data.message ||
          "Qormaata uumuu hin dandeenye."
        );
      }

      message.innerHTML = `
        <div class="success">
          <h3>✅ Qormaanni uumameera!</h3>

          <p>
            <b>Exam Code:</b>
            ${data.exam.code}
          </p>

          <p>
            <b>Linkii:</b>
          </p>

          <div class="link-box">
            ${data.link}
          </div>

          <button
            onclick="copyText('${data.link}')"
          >
            📋 Linkii Garagalchi
          </button>

          <button
            onclick="copyText('${data.exam.code}')"
          >
            📋 Code Garagalchi
          </button>
        </div>
      `;

    } catch (error) {
      message.innerHTML =
        `<div class="error">
          ${error.message}
        </div>`;
    }
  }

  async function loadExam() {
    const code =
      document.getElementById(
        "examCode"
      ).value.trim().toUpperCase();

    const studentName =
      document.getElementById(
        "studentName"
      ).value.trim();

    const message =
      document.getElementById(
        "joinMessage"
      );

    if (!studentName) {
      message.innerHTML =
        `<div class="error">
          Maqaa barataa galchi.
        </div>`;

      return;
    }

    if (!code) {
      message.innerHTML =
        `<div class="error">
          Exam Code galchi.
        </div>`;

      return;
    }

    try {
      const response =
        await fetch(
          `/api/exams/${code}`
        );

      const data =
        await response.json();

      if (!response.ok) {
        throw new Error(
          data.message
        );
      }

      currentExam = data.exam;

      showExam();

    } catch (error) {
      message.innerHTML =
        `<div class="error">
          ${error.message}
        </div>`;
    }
  }

  function showExam() {
    hideAll();

    document
      .getElementById("exam")
      .classList.remove("hidden");

    document.getElementById(
      "examInfo"
    ).innerHTML = `
      <h2>${currentExam.title}</h2>

      <p>
        <b>Barnoota:</b>
        ${currentExam.subject || "-"}
      </p>

      <p>
        <b>Kutaa:</b>
        ${currentExam.grade || "-"}
      </p>

      <p>
        <b>Barsiisaa:</b>
        ${currentExam.teacherName}
      </p>
    `;

    const container =
      document.getElementById(
        "examQuestions"
      );

    container.innerHTML = "";

    currentExam.questions.forEach(
      (q, index) => {
        const div =
          document.createElement(
            "div"
          );

        div.className =
          "question";

        let options = "";

        q.options.forEach(
          (option, i) => {
            const letter =
              String.fromCharCode(
                65 + i
              );

            options += `
              <label class="option">
                <input
                  type="radio"
                  name="q_${q.id}"
                  value="${escapeHtml(option)}"
                >
                <span>
                  ${letter}.
                  ${escapeHtml(option)}
                </span>
              </label>
            `;
          }
        );

        div.innerHTML = `
          <h3>
            ${index + 1}.
            ${escapeHtml(q.question)}
          </h3>

          ${options}

          <div class="small">
            Qabxii: ${q.points}
          </div>
        `;

        container.appendChild(div);
      }
    );

    startTimer(currentExam.duration);
  }

  function startTimer(minutes) {
    if (timerInterval) {
      clearInterval(timerInterval);
    }

    remainingSeconds =
      Number(minutes) * 60;

    updateTimer();

    timerInterval =
      setInterval(() => {
        remainingSeconds--;

        updateTimer();

        if (remainingSeconds <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;

          alert(
            "Yeroon qormaataa xumurameera."
          );

          submitExam();
        }
      }, 1000);
  }

  function updateTimer() {
    const min =
      Math.floor(
        remainingSeconds / 60
      );

    const sec =
      remainingSeconds % 60;

    document.getElementById(
      "timer"
    ).textContent =
      `⏱️ ${String(min).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
  }

  async function submitExam() {
    if (!currentExam) return;

    const answers = {};

    currentExam.questions.forEach(
      q => {
        const selected =
          document.querySelector(
            `input[name="q_${q.id}"]:checked`
          );

        if (selected) {
          answers[q.id] =
            selected.value;
        }
      }
    );

    const studentName =
      document.getElementById(
        "studentName"
      ).value.trim();

    if (!studentName) {
      alert(
        "Maqaa barataa hin argamne."
      );

      return;
    }

    const unanswered =
      currentExam.questions.filter(
        q => !answers[q.id]
      ).length;

    if (unanswered > 0) {
      const confirmSubmit =
        confirm(
          `Gaaffii ${unanswered} hin deebifne. Amma erguu barbaaddaa?`
        );

      if (!confirmSubmit) {
        return;
      }
    }

    try {
      const response =
        await fetch(
          `/api/exams/${currentExam.code}/submit`,
          {
            method: "POST",
            headers: {
              "Content-Type":
                "application/json"
            },
            body: JSON.stringify({
              studentName,
              answers
            })
          }
        );

      const data =
        await response.json();

      if (!response.ok) {
        throw new Error(
          data.message
        );
      }

      if (timerInterval) {
        clearInterval(
          timerInterval
        );
        timerInterval = null;
      }

      showResult(
        data.result
      );

    } catch (error) {
      alert(error.message);
    }
  }

  function showResult(result) {
    hideAll();

    document
      .getElementById("result")
      .classList.remove("hidden");

    let details = "";

    result.details.forEach(
      (d, index) => {
        details += `
          <div class="question">
            <b>${index + 1}. ${escapeHtml(d.question)}</b>

            <p>
              Deebii kee:
              <b>
                ${escapeHtml(
                  d.studentAnswer || "Hin deebifne"
                )}
              </b>
            </p>

            <p>
              Deebii sirrii:
              <b>
                ${escapeHtml(d.correctAnswer)}
              </b>
            </p>

            <p>
              ${
                d.correct
                  ? "✅ Sirrii"
                  : "❌ Dogoggora"
              }
            </p>
          </div>
        `;
      }
    );

    document.getElementById(
      "resultContent"
    ).innerHTML = `
      <p>
        <b>Barataa:</b>
        ${escapeHtml(result.studentName)}
      </p>

      <p>
        <b>Qormaata:</b>
        ${escapeHtml(result.examTitle)}
      </p>

      <div class="result-number">
        ${result.percentage}%
      </div>

      <p style="text-align:center">
        ${result.score}
        / ${result.totalPoints}
      </p>

      <div class="success">
        <b>Sirrii:</b>
        ${result.correctAnswers}
        &nbsp;&nbsp;

        <b>Dogoggora:</b>
        ${result.wrongAnswers}
      </div>

      <h3>
        Deebii Gaaffiiwwanii
      </h3>

      ${details}
    `;
  }

  async function loadTeacherResults() {
    const code =
      document.getElementById(
        "teacherCode"
      ).value.trim().toUpperCase();

    const container =
      document.getElementById(
        "teacherResultContent"
      );

    if (!code) {
      container.innerHTML =
        `<div class="error">
          Exam Code galchi.
        </div>`;

      return;
    }

    try {
      const response =
        await fetch(
          `/api/exams/${code}/results`
        );

      const data =
        await response.json();

      if (!response.ok) {
        throw new Error(
          data.message
        );
      }

      let rows = "";

      data.results.forEach(
        (r, index) => {
          rows += `
            <tr>
              <td>${index + 1}</td>

              <td>
                ${escapeHtml(
                  r.studentName
                )}
              </td>

              <td>
                ${r.score}/${r.totalPoints}
              </td>

              <td>
                ${r.percentage}%
              </td>

              <td>
                ${r.correctAnswers}
              </td>

              <td>
                ${r.wrongAnswers}
              </td>
            </tr>
          `;
        }
      );

      container.innerHTML = `
        <div class="success">
          <h3>
            ${escapeHtml(
              data.exam.title
            )}
          </h3>

          <p>
            Barattoota:
            <b>${data.totalStudents}</b>
          </p>
        </div>

        ${
          data.results.length
            ? `
              <div style="overflow-x:auto">
                <table>
                  <thead>
                    <tr>
                      <th>#</th>
                      <th>Barataa</th>
                      <th>Qabxii</th>
                      <th>%</th>
                      <th>Sirrii</th>
                      <th>Dogoggora</th>
                    </tr>
                  </thead>

                  <tbody>
                    ${rows}
                  </tbody>
                </table>
              </div>
            `
            : `
              <div class="info">
                Ammaaf barataan
                qormaata hin fudhanne.
              </div>
            `
        }
      `;

    } catch (error) {
      container.innerHTML =
        `<div class="error">
          ${error.message}
        </div>`;
    }
  }

  async function checkServer() {
    hideAll();

    document
      .getElementById("status")
      .classList.remove("hidden");

    const container =
      document.getElementById(
        "statusContent"
      );

    container.innerHTML =
      `<div class="info">
        Sirna ilaalamaa jira...
      </div>`;

    try {
      const response =
        await fetch("/api/status");

      const data =
        await response.json();

      if (data.success) {
        container.innerHTML = `
          <div class="success">
            <h3>🟢 Sirni online dha</h3>

            <p>
              App:
              <b>${data.app}</b>
            </p>

            <p>
              Database:
              <b>${data.database}</b>
            </p>

            <p>
              Status:
              <b>${data.status}</b>
            </p>
          </div>
        `;
      } else {
        throw new Error(
          "Serveriin rakkoo qaba."
        );
      }

    } catch (error) {
      container.innerHTML =
        `<div class="error">
          🔴 Serveriin database waliin
          wal hin qunnamin.
        </div>`;
    }
  }

  function copyText(value) {
    navigator.clipboard
      .writeText(value)
      .then(() => {
        alert(
          "Garagalfameera."
        );
      });
  }

  function escapeHtml(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  // URL irraa exam code yoo dhufe
  window.addEventListener(
    "load",
    () => {
      const params =
        new URLSearchParams(
          window.location.search
        );

      const code =
        params.get("exam");

      if (code) {
        showJoin();

        document.getElementById(
          "examCode"
        ).value =
          code.toUpperCase();
      }
    }
  );
</script>
